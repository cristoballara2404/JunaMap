# Levanta solo la base de datos (PostgreSQL + PostGIS) con el esquema y los datos de ejemplo ya cargados.
# Uso: cp .env.example .env && docker compose up -d
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: junamap
      POSTGRES_USER: junamap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro   # ejecuta schema.sql y luego seed.sql al crear el volumen
      - junamap_pgdata:/var/lib/postgresql/data
volumes:
  junamap_pgdata:
